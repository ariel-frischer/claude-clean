name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-run a release for an existing tag with the current workflow file
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run tests
      run: go test -v ./...

    - name: Install chlog
      run: go install github.com/ariel-frischer/chlog/cmd/chlog@v0.3.1

    - name: Extract release notes
      run: chlog extract "${TAG#v}" > /tmp/release-notes.md

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        version: '~> v2'
        args: release --clean --release-notes /tmp/release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GORELEASER_CURRENT_TAG: ${{ env.TAG }}
