version: 2

project_name: cclean

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/cclean
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    binary: cclean

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

release:
  # Lets a workflow_dispatch re-run replace assets of an existing release
  replace_existing_artifacts: true

